<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#14532d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- COLUMN 1: In-Browser Simulation Demand (Wokwi / Tinkercad) -->
  <g transform="translate(230, 30)">
    <!-- Top source label -->
    <text x="0" y="24" text-anchor="middle" font-size="19" font-weight="600" fill="#475569" letter-spacing="-0.2">wokwi.com / tinkercad</text>

    <!-- Circle 1 -->
    <g filter="url(#softShadow)">
      <circle cx="0" cy="180" r="115" fill="#16a34a"/>
    </g>
    <!-- Numbers inside circle -->
    <text x="0" y="172" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">50M+</text>
    <text x="0" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#dcfce7">Browser Circuit Users</text>

    <!-- Bottom subtitle -->
    <text x="0" y="340" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">
      <tspan x="0" dy="0">Engineers actively simulating hardware in-browser</tspan>
      <tspan x="0" dy="20">to avoid heavy desktop software and driver setups</tspan>
    </text>
  </g>

  <!-- COLUMN 2: Firmware & Microcontroller Demand (Arduino / PlatformIO) -->
  <g transform="translate(690, 30)">
    <!-- Top source label -->
    <text x="0" y="24" text-anchor="middle" font-size="19" font-weight="600" fill="#475569" letter-spacing="-0.2">arduino.cc / platformio</text>

    <!-- Circle 2 -->
    <g filter="url(#softShadow)">
      <circle cx="0" cy="180" r="115" fill="#22c55e"/>
    </g>
    <!-- Numbers inside circle -->
    <text x="0" y="172" text-anchor="middle" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-1">10M+</text>
    <text x="0" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#dcfce7">Active Hardware Devs</text>

    <!-- Bottom subtitle -->
    <text x="0" y="340" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">
      <tspan x="0" dy="0">Prototyping &amp; flashing code to microcontrollers</tspan>
      <tspan x="0" dy="20">daily across 1,000+ development boards</tspan>
    </text>
  </g>
</svg>